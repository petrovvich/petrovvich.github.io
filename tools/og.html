<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f2f4f6;
    color: #17233a;
    font-family: "Golos Text", sans-serif;
    position: relative;
    box-sizing: border-box;
    padding: 96px 96px 0 136px;
  }
  .rail { position: absolute; left: 72px; top: 0; bottom: 0; width: 4px; background: #0e7a5c; }
  .gateway {
    position: absolute; left: 62px; top: 112px; width: 20px; height: 20px;
    transform: rotate(45deg); background: #d6ece4; border: 2px solid #0e7a5c; border-radius: 2px;
  }
  h1 { font: 500 76px/1.02 "Unbounded", sans-serif; letter-spacing: -0.03em; margin: 0 0 28px; }
  .role { font: 500 40px/1.2 "Unbounded", sans-serif; margin: 0 0 20px; }
  .focus { font-size: 28px; color: #5a6577; margin: 0; max-width: 900px; line-height: 1.4; }
  .url { position: absolute; left: 136px; bottom: 64px; font-size: 26px; font-weight: 500; color: #0e7a5c; }
</style>
</head>
<body>
  <div class="rail"></div>
  <div class="gateway"></div>
  <h1>Aleksandr Romaniuk</h1>
  <p class="role">Full Cycle Engineer</p>
  <p class="focus">Backend (Java), Frontend (React), DevOps, team leadership, FinTech, risk management</p>
  <p class="url">petrovvich.github.io</p>
</body>
</html>
